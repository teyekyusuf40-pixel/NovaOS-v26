<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>NovaOS v26 | Yusuf & Gemini</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="os-container">
        <!-- Masaüstü Alanı -->
        <div id="desktop">
            <div class="icon" onclick="openApp('terminal')">🖥️ Terminal</div>
            <div class="icon" onclick="openApp('snake')">🐍 Yılan Oyunu</div>
        </div>
        
        <!-- Görev Çubuğu -->
        <div id="taskbar">
            <button id="start-btn">BAŞLAT</button>
            <div id="clock"></div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
